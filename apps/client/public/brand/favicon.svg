      <stop offset="0%" stopColor="#FB7185" />
      <stop offset="100%" stopColor="#E11D48" />
    </linearGradient>
    <linearGradient id="fav-body" x1="50" y1="35" x2="50" y2="95" gradientUnits="userSpaceOnUse">
